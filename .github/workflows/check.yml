name: Check handbook
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  links-and-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tools/requirements-check.txt
      - name: Install packages used by some lessons
        run: pip install -r tools/requirements-check.txt
      - name: Every topic has the same pages in the same format
        run: python tools/normalize_topics.py --check
      - name: Index, tracker and READMEs are generated and up to date
        run: python tools/build_index.py --check
      - name: Check relative links
        run: python tools/check_links.py
      - name: Make sure the ps command exists (a lesson runs it)
        run: command -v ps >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq procps)
      - name: Run every code block
        run: python tools/check_code_blocks.py
